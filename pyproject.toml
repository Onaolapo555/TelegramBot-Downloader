[project]
name = "unimedia-downloader-bot"
version = "0.1.0"
description = "Fastest, most reliable Telegram media downloader bot - yt-dlp + aiogram 3 + Local Bot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.13.1",
    "aiohttp==3.10.11",
    "yt-dlp>=2024.12.0",
    "pydantic>=2.4.1,<2.12",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "redis>=4.2.0,<6",
    "arq==0.26",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "aiosqlite==0.20.0",
    "boto3>=1.30",
    "aiofiles==24.1.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
